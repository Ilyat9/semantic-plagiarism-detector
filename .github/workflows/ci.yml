name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        # Полный sync (включая dev-группу): ниже запускаются pytest и ruff.
        # --no-dev здесь был бы самообманом — uv run всё равно дотягивал бы dev.
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Format check with ruff
        run: uv run ruff format --check .

      - name: Test with pytest (fast)
        run: uv run pytest -m "not slow" -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build . -t plagcheck:test

      - name: Test Docker image runs
        run: |
          docker run -d --name plagcheck-test -p 8000:8000 plagcheck:test
          # ждём старта uvicorn (на CI-раннере первый запуск занимает больше 5 с)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ > /dev/null; then
              echo "Service is up after ~$((i * 2))s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Service failed to start, container logs:"
              docker logs plagcheck-test
              exit 1
            fi
            sleep 2
          done
          docker stop plagcheck-test
