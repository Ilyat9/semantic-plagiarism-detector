<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semantic Plagiarism Detection</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5" style="max-width: 720px;">
  <h1 class="mb-3">Semantic Plagiarism &amp; Paraphrase Detection</h1>
  <p class="text-muted">
    Загрузите документ (.docx, .pdf, .txt) — система найдёт похожие источники в интернете
    и определит прямое заимствование (verbatim) и перефраз (paraphrase).
  </p>
  <form method="post" action="/check" enctype="multipart/form-data" class="card p-4">
    <div class="mb-3">
      <input class="form-control" type="file" name="file" accept=".docx,.pdf,.txt" required>
    </div>
    <button type="submit" class="btn btn-primary">Проверить</button>
    <div class="form-text mt-2">Проверка занимает 1–3 минуты (поиск + скрапинг + ML-сравнение).</div>
  </form>
</div>
</body>
</html>
